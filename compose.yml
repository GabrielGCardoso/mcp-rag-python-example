services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  docs-mcp:
    build: .
    image: vector-search-docs-mcp:latest
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      EMBED_BACKEND: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      # OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      EMBED_NUM_CTX: ${EMBED_NUM_CTX:-}
      SQLITE_PATH: /data/index.sqlite
    ports:
      - "8000:8000"
    volumes:
      - ./fcc_docs:/app/fcc_docs:ro
      - ./sources.yaml:/app/sources.yaml:ro
      - index_data:/data
    depends_on:
      - ollama

volumes:
  ollama_data:
  index_data:
